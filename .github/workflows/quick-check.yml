name: Quick site checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Verify public production build
        run: npm run verify
        env:
          CONTEXT: production
          SITE_URL: https://giraffegallery.com
          CATALOG_DATA_MODE: legacy
          ACTIVITY_DATA_MODE: legacy
          PUBLISH_RELEASED_ONLY: 'true'
