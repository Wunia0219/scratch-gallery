version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-compatible-updates:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is incompatible with the current vue-tsc compiler integration.
      # Revisit this exclusion when upgrading the Vue type-checking toolchain.
      - dependency-name: typescript
        versions: ['7.x']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-updates:
        patterns: ['*']
