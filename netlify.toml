[build]
  command = "npm run verify && npm audit --audit-level=high"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[functions.home]
  included_files = [".netlify/server/**"]

[[redirects]]
  from = "https://scratch-gallery.netlify.app/*"
  to = "https://giraffegallery.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/home"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/.netlify/functions/home"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "24"
  SITE_URL = "https://giraffegallery.com"

# No SPA catch-all: nonexistent work URLs must remain real 404 responses.
